function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function E(g,x,y,rx,ry,f,s,lw,rot){g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);if(f){g.fillStyle=f;g.fill();}if(s){g.lineWidth=lw||3;g.strokeStyle=s;g.stroke();}}
function C(g,x,y,r,f,s,lw){E(g,x,y,r,r,f,s,lw);}
function P(g,pts,f,s,lw){g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath();if(f){g.fillStyle=f;g.fill();}if(s){g.lineWidth=lw||3;g.lineJoin='round';g.strokeStyle=s;g.stroke();}}
function R(g,x,y,w,h,r,f,s,lw){rr(g,x,y,w,h,r);if(f){g.fillStyle=f;g.fill();}if(s){g.lineWidth=lw||3;g.strokeStyle=s;g.stroke();}}

function wrapText(text,maxW,size){ctx.font=size+'px '+FONT;const words=text.split(' ');const lines=[];let cur='';
 for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}
function drawBubble(x,y,w,h,text,tx,ty,k){ctx.save();const cx=x+w/2,cy=y+h/2;ctx.translate(tx,ty);ctx.scale(k,k);ctx.translate(-tx,-ty);
 R(ctx,x+2,y+4,w,h,16,'rgba(0,0,0,.3)');
 P(ctx,[x+4,y+h*.42,tx,ty,x+4,y+h*.78],'#f3efff','#3a0c7a',3);
 R(ctx,x,y,w,h,16,lg(ctx,0,y,0,y+h,['#ffffff','#e9e2ff']),'#3a0c7a',3);
 P(ctx,[x+5,y+h*.45,tx+4,ty,x+5,y+h*.75],'#f1ecff');
 let size=18,lines=wrapText(text,w-20,size);while(lines.length>2&&size>13){size--;lines=wrapText(text,w-20,size);}
 ctx.fillStyle='#3a0c7a';ctx.textAlign='center';ctx.textBaseline='middle';
 lines.forEach((l,i)=>ctx.fillText(l,cx,cy+(i-(lines.length-1)/2)*(size+2)));
 ctx.restore();}

/* ---------- audio ---------- */
let AC=null;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
function tone(f,d,type,vol,slide,delay){if(!AC||muted)return;const t0=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+d);g.gain.setValueAtTime(vol||.2,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.03);}
let NB=null;
function noise(d,vol,freq,delay){if(!AC||muted)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
 const t0=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||800;const g=AC.createGain();g.gain.setValueAtTime(vol||.3,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t0);s.stop(t0+d+.03);}
const NOTES=[523,587,659,784,880,1047,1175,1319,1568];
function sfx(n,k){switch(n){
 case 'swap':tone(520,.08,'triangle',.14,1.5);break;
 case 'bad':tone(170,.18,'square',.07,.7);break;
 case 'match':{const f=NOTES[Math.min((k||1)-1,8)];tone(f,.2,'triangle',.18);tone(f*2,.14,'sine',.06,1,.03);break;}
 case 'special':tone(660,.1,'square',.06);tone(990,.14,'square',.06,1,.08);tone(1320,.22,'triangle',.1,1,.16);break;
 case 'train':tone(740,.4,'sawtooth',.04);tone(932,.4,'sawtooth',.04);for(let i=0;i<4;i++)noise(.06,.25,1200,i*.09);break;
 case 'poop':tone(320,.3,'sine',.25,.3);noise(.2,.2,400,.05);break;
 case 'boom':noise(.55,.55,300);tone(90,.45,'sine',.3,.4);break;
 case 'ufo':tone(300,.7,'sine',.12,4);tone(1200,.7,'triangle',.05,.3);break;
 case 'level':[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.15,1,i*.09));break;
 case 'over':[523,392,330,262].forEach((f,i)=>tone(f,.3,'triangle',.15,1,i*.16));break;
 case 'click':tone(820,.05,'triangle',.1);break;

const rnd7=()=>Math.floor(Math.random()*7);
function newTile(t){return{t,sp:null,x:0,y:0,vy:0,pop:0,land:0,dying:false,used:false,id:++uid};}
const tt=(r,c)=>{const x=grid[r]&&grid[r][c];return x&&!x.dying?x.t:-1;};

function newBoard(){let tries=0;
 do{grid=[];for(let r=0;r<N;r++){const row=[];grid.push(row);for(let c=0;c<N;c++){let t;
   do{t=rnd7();}while((c>=2&&row[c-1].t===t&&row[c-2].t===t)||(r>=2&&grid[r-1][c].t===t&&grid[r-2][c].t===t));
   const tl=newTile(t);tl.x=c;tl.y=r-N-1-c*.35;tl.vy=2;row.push(tl);}}

function findRuns(){const runs=[];
 for(let r=0;r<N;r++){let c=0;while(c<N){const t=tt(r,c);if(t<0||t>6){c++;continue;}let e=c+1;while(e<N&&tt(r,e)===t)e++;
  if(e-c>=3){const cells=[];for(let k=c;k<e;k++)cells.push([r,k]);runs.push({dir:'h',t,cells});}c=e;}}
 for(let c=0;c<N;c++){let r=0;while(r<N){const t=tt(r,c);if(t<0||t>6){r++;continue;}let e=r+1;while(e<N&&tt(e,c)===t)e++;
  if(e-r>=3){const cells=[];for(let k=r;k<e;k++)cells.push([k,c]);runs.push({dir:'v',t,cells});}r=e;}}

function matchAt(r,c){const t=tt(r,c);if(t<0||t>6)return false;let n=1;
 for(let k=c-1;k>=0&&tt(r,k)===t;k--)n++;for(let k=c+1;k<N&&tt(r,k)===t;k++)n++;if(n>=3)return true;
 n=1;for(let k=r-1;k>=0&&tt(k,c)===t;k--)n++;for(let k=r+1;k<N&&tt(k,c)===t;k++)n++;return n>=3;}
function findMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const [dr,dc] of [[0,1],[1,0]]){const r2=r+dr,c2=c+dc;if(r2>=N||c2>=N)continue;

 grid[r][c]=b;grid[r2][c2]=a;const ok=matchAt(r,c)||matchAt(r2,c2);grid[r][c]=a;grid[r2][c2]=b;if(ok)return[r,c,r2,c2];}

function commonType(){const n=[0,0,0,0,0,0,0];for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=tt(r,c);if(t>=0&&t<7)n[t]++;}let b=0;for(let i=1;i<7;i++)if(n[i]>n[b])b=i;return b;}

function trySwap(r1,c1,r2,c2){

 const runs=findRuns();

  if(Math.random()<.4)hostSay(BAD[Math.floor(Math.random()*BAD.length)],1.4);return;}

function useMove(){if(mode==='hood')moves--;}
function motherSwap(m,mr,mc,o){m.used=true;const marks=[[mr,mc]],tg=[];
 if(o.t===7){o.used=true;for(let r=0;r<N;r++)for(let c=0;c<N;c++){marks.push([r,c]);tg.push([cx(c),cy(r)]);}hostSay('Double mothership! Clear the decks!',2.6,'wink');}
 else{for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(tt(r,c)===o.t){marks.push([r,c]);tg.push([cx(c),cy(r)]);}hostSay('Beam up every '+NAMES[o.t]+'!',2.2,'wink');}
 fxs.push({k:'beam',x0:cx(mc),y0:cy(mr),tg,t:0,dur:.5});sfx('ufo');shake=7;detonate(marks,[]);}

const SP_LINES={row:'Freight train comin\' through!',col:'Hippo drop incoming!',bomb:'Pothole bomb, baby!',ufo:'MOTHERSHIP! Swap it with anything!'};
const CASCADE_LINES=['','','Nice!','Hoo-wee!','Yeehaw!','Muncie magic!','Unstoppable!','Holy potholes!'];
const SMALL_LINES=['Smooth.','There ya go!','Pothole Patrol approved.','Lookin\' good!','Keep \'em comin\'!'];
function resolve(runs,prefer){
 const parent=runs.map((_,i)=>i);const find=i=>parent[i]===i?i:(parent[i]=find(parent[i]));const owner={};
 runs.forEach((run,i)=>run.cells.forEach(([r,c])=>{const k=r*N+c;if(owner[k]!==undefined)parent[find(i)]=find(owner[k]);else owner[k]=i;}));
 const groups={};runs.forEach((run,i)=>{const f=find(i);(groups[f]=groups[f]||[]).push(run);});
 const marks=[],creations=[];
 for(const g of Object.values(groups)){const set=new Map();let hasH=false,hasV=false,maxLen=0,maxRun=null;
  g.forEach(run=>{run.cells.forEach(([r,c])=>set.set(r*N+c,[r,c]));if(run.dir==='h')hasH=true;else hasV=true;if(run.cells.length>maxLen){maxLen=run.cells.length;maxRun=run;}});
  set.forEach(p=>marks.push(p));
  let sp=null;if(maxLen>=5)sp='ufo';else if(hasH&&hasV)sp='bomb';else if(maxLen===4)sp=maxRun.dir==='h'?'row':'col';
  if(sp){let piv=null;
   if(prefer)for(const [pr,pc] of prefer)if(set.has(pr*N+pc)){piv=[pr,pc];break;}
   if(!piv&&sp==='bomb'){const hs=new Set();g.filter(x=>x.dir==='h').forEach(x=>x.cells.forEach(([a,b])=>hs.add(a*N+b)));for(const x of g)if(x.dir==='v')for(const [a,b] of x.cells)if(hs.has(a*N+b))piv=[a,b];}
   if(!piv){const mc=maxRun.cells;piv=mc[Math.floor((mc.length-1)/2)];}
   creations.push({r:piv[0],c:piv[1],t:sp==='ufo'?7:g[0].t,sp:sp==='ufo'?null:sp,key:sp});}}
 if(cascade>=2)hostSay(CASCADE_LINES[Math.min(cascade,7)]+(cascade>=3?' '+cascade+'x combo!':''),1.8,cascade>=5?'wink':'');
 else if(creations.length)hostSay(SP_LINES[creations[0].key],2,creations[0].key==='ufo'?'wink':'');
 else if(Math.random()<.12)hostSay(SMALL_LINES[Math.floor(Math.random()*SMALL_LINES.length)],1.4);
 detonate(marks,creations);}
function detonate(marks,creations){const cleared=new Set(),queue=[];
 const mark=(r,c)=>{if(r<0||c<0||r>=N||c>=N)return;const k=r*N+c;if(cleared.has(k))return;const t=grid[r][c];if(!t||t.dying)return;cleared.add(k);if((t.sp||t.t===7)&&!t.used)queue.push([r,c,t]);};
 marks.forEach(([r,c])=>mark(r,c));
 let specials=0;
 while(queue.length){const [r,c,t]=queue.shift();t.used=true;specials++;
  if(t.t===7){const ty=commonType(),tg=[];for(let rr2=0;rr2<N;rr2++)for(let cc=0;cc<N;cc++)if(tt(rr2,cc)===ty){mark(rr2,cc);tg.push([cx(cc),cy(rr2)]);}fxs.push({k:'beam',x0:cx(c),y0:cy(r),tg,t:0,dur:.5});sfx('ufo');}
  else if(t.sp==='row'){for(let k=0;k<N;k++)mark(r,k);fxs.push({k:'train',r,t:0,dur:.5});fxs.push({k:'band',x:BX,y:BY+r*CS,w:CS*N,h:CS,t:0,dur:.35});sfx('train');shake=Math.max(shake,4);}
  else if(t.sp==='col'){for(let k=0;k<N;k++)mark(k,c);fxs.push({k:'poop',c,t:0,dur:.45});fxs.push({k:'band',x:BX+c*CS,y:BY,w:CS,h:CS*N,t:0,dur:.35});sfx('poop');shake=Math.max(shake,4);}
  else if(t.sp==='bomb'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)mark(r+dr,c+dc);fxs.push({k:'ring',x:cx(c),y:cy(r),t:0,dur:.5});burst(cx(c),cy(r),'#ff8a00',18);sfx('boom');shake=Math.max(shake,8);}}
 const n=cleared.size;const pts=n*10*cascade+creations.length*50+specials*30;addScore(pts);
 let sx=0,sy=0;clearedCells=[];
 cleared.forEach(k=>{const r=Math.floor(k/N),c=k%N,t=grid[r][c];t.dying=true;clearedCells.push([r,c]);sx+=cx(c);sy+=cy(r);
  burst(cx(c),cy(r),t.t===7?'#ffffff':TC[t.t][1],6);});
 if(n){floats.push({x:sx/n,y:sy/n,text:'+'+pts,t:0,dur:1,size:18+Math.min(cascade,6)*3,col:cascade>1?'#fff27a':'#ffffff'});}
 if(mode==='blitz'&&creations.length){timeLeft+=2*creations.length;floats.push({x:LW-60,y:110,text:'+'+(2*creations.length)+'s',t:0,dur:1,size:20,col:'#9dff7a'});}
 pendingCreate=creations;phase='clear';phaseT=0;sfx('match',cascade);if(creations.length)sfx('special');}
function finishClear(){
 clearedCells.forEach(([r,c])=>{grid[r][c]=null;});
 pendingCreate.forEach(cr=>{const nt=newTile(cr.t);nt.sp=cr.sp;nt.x=cr.c;nt.y=cr.r;nt.pop=1;grid[cr.r][cr.c]=nt;});
 pendingCreate=[];clearedCells=[];
 for(let c=0;c<N;c++){let w=N-1;for(let r=N-1;r>=0;r--){const t=grid[r][c];if(t){if(r!==w){grid[w][c]=t;grid[r][c]=null;}w--;}}
  for(let r=w;r>=0;r--){const t=newTile(rnd7());t.x=c;t.y=r-(w+1)-.3;t.vy=3;grid[r][c]=t;}}

function stepFall(dt){let moving=false,landed=false;
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=grid[r][c];if(!t)continue;t.x=c;
  if(t.y<r){t.vy+=55*dt;t.y+=t.vy*dt;if(t.y>=r){t.y=r;t.vy=0;t.land=1;landed=true;}else moving=true;}else t.y=r;}

function turnEnd(){cascade=0;phase='idle';

/* ---------- loop ---------- */
function update(dt){
 host.t+=dt;host.bounce=Math.max(0,host.bounce-dt*2.5);host.wink=Math.max(0,host.wink-dt);host.talk=Math.max(0,host.talk-dt);
 host.blinkT-=dt;if(host.blinkT<=0){host.blink=.13;host.blinkT=2+Math.random()*3;}host.blink=Math.max(0,host.blink-dt);
 updateFx(dt);
 if(screen!=='game')return;
 phaseT+=dt;
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=grid[r][c];if(!t)continue;if(t.pop>0)t.pop=Math.max(0,t.pop-dt*3);if(t.land>0)t.land=Math.max(0,t.land-dt*6);}
 if(phase==='swap'){if(tweenSwap())afterSwap();}
 else if(phase==='unswap'){if(tweenSwap())phase='idle';}
 else if(phase==='clear'){if(phaseT>=CLEART)finishClear();}
 else if(phase==='fall'){stepFall(dt);}
 if(mode==='blitz'&&!timeUp){timeLeft-=dt;const s=Math.ceil(timeLeft);if(s<=10&&s>0&&s!==lastTick){lastTick=s;sfx('tick');}if(s===10&&lastTick===10&&host.t>2)hostSay('10 seconds! Hurry!',1.5);if(timeLeft<=0){timeLeft=0;timeUp=true;sel=null;}}
 if(mode==='blitz'&&timeUp&&phase==='idle')gameOver('TIME\'S UP!');
 dispScore+=(score-dispScore)*Math.min(1,dt*10);if(Math.abs(score-dispScore)<1)dispScore=score;
 if(phase==='idle'){idleT+=dt;if(idleT>10&&!hint){hint=findMove();}}
 host.chatT+=dt;if(host.chatT>14&&phase==='idle'){const tips=['Match 4 in a row for a freight train or a hippo drop!','Make an L or T shape for a pothole bomb!','Match 5 to call the mothership!','Stuck? Tap the ? for a hint.','Swipe a tile, or tap two neighbors.'];hostSay(tips[Math.floor(Math.random()*tips.length)],3);}}

 drawBG();
 if(screen==='title')drawTitle();
 else if(screen==='hoods')drawHoods();
 else{drawGame();if(screen==='pause')drawPause();else if(screen==='over')drawOver();else if(screen==='clear')drawClear();}}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;update(dt);draw();requestAnimationFrame(frame);}

cv.addEventListener('pointermove',e=>{if(!down||down.used)return;const p=toL(e);const dx=p.x-down.x,dy=p.y-down.y;
 if(Math.max(Math.abs(dx),Math.abs(dy))>CS*.35){down.used=true;if(phase!=='idle')return;
  if(Math.abs(dx)>Math.abs(dy))trySwap(down.r,down.c,down.r,down.c+(dx>0?1:-1));else trySwap(down.r,down.c,down.r+(dy>0?1:-1),down.c);}});
cv.addEventListener('pointerup',e=>{const p=toL(e);
